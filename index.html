 case 'gdel':confirmDel(tr('Delete record?','حذف السجل؟'),tr('This record will be permanently removed.','سيتم حذف هذا السجل نهائيًا.'),'','gdelok',d.id);break;
 case 'gdelok':{const L=DATA[ent(S.route).src];L.splice(L.findIndex(x=>x.id==+d.id),1);closeModal();render();toast(tr('Deleted.','تم الحذف.'));break}
 case 'cin':if(!d.id){toast(tr('No arrival is ready for check-in.','لا يوجد وصول جاهز للتسجيل.'),1);break}S.cin=d.id;go('cin');break;
 case 'vbook':{const a=DATA.arr.find(x=>x.id==d.id),g=gst(a.guest),x=rm(a.room);modal(tr('Booking details','تفاصيل الحجز'),a.id,`<div class="fgrid"><div><small style="color:var(--mut)">${tr('Guest','النزيل')}</small><div style="font-weight:600">${esc(g.name)}</div></div><div><small style="color:var(--mut)">${tr('Status','الحالة')}</small><div>${pill(a.status)}</div></div><div><small style="color:var(--mut)">${tr('Room','الغرفة')}</small><div style="font-weight:600">${x.no} · ${esc(vt(x.type))}</div></div><div><small style="color:var(--mut)">${tr('Stay','الإقامة')}</small><div style="font-weight:600">${fr(a.in,a.out)}</div></div><div><small style="color:var(--mut)">${tr('Source','المصدر')}</small><div style="font-weight:600">${a.src}</div></div><div><small style="color:var(--mut)">${tr('Deposit','الوديعة')}</small><div style="font-weight:600">${money(a.deposit)}</div></div></div>`,btn('close',tr('Close','إغلاق'))+(a.status=='notready'?btn('mready',tr('Mark room as ready','تحديد الغرفة كجاهزة'),'navy',`data-id="${a.id}"`):btn('rdep',tr('Record deposit','تسجيل الوديعة'),'navy',`data-id="${a.id}"`)),'s');break}
 case 'mready':{DATA.arr.find(x=>x.id==d.id).status='ready';closeModal();render();toast(tr('Room marked as ready.','تم تحديد الغرفة كجاهزة.'));break}
 case 'rdep':{const a=DATA.arr.find(x=>x.id==d.id);a.deposit=150;a.status='ready';closeModal();render();toast(tr('Deposit recorded.','تم تسجيل الوديعة.'));break}
 case 'cinok':{const v=n=>$f(n).value.trim(),er=m=>{$('#ferr').textContent=m},em=readEmail(),nat=$f('nat').dataset.code,a=DATA.arr.find(x=>x.id==S.cin);
  if(!v('name'))return er(tr('Required: Full name','مطلوب: الاسم الكامل'));if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))return er(tr('Please enter a valid email.','من فضلك أدخل بريدًا إلكترونيًا صحيحًا.'));if(!v('phone'))return er(tr('Required: Phone number','مطلوب: رقم الهاتف'));if(!nat)return er(tr('Choose a nationality from the list.','اختر الجنسية من القائمة.'));if(!v('idn'))return er(tr('Required: Document number','مطلوب: رقم الوثيقة'));if(!$('#idv').checked)return er(tr('Please confirm identity verification and registration.','من فضلك أكّد التحقق من الهوية والتسجيل.'));
  Object.assign(gst(a.guest),{name:v('name'),email:em,phone:v('phone'),nat,idt:v('idt'),idn:v('idn')});a.room=+v('room');rm(a.room).status='Occupied';a.status='checked';go('cdone');break}
 case 'cout':{const dp=DATA.dep.find(x=>x.id==d.id);modal(tr('Check out guest','تسجيل خروج نزيل'),dp.id,`<div class="fgrid"><div><small style="color:var(--mut)">${tr('Guest','النزيل')}</small><div style="font-weight:600">${esc(gst(dp.guest).name)}</div></div><div><small style="color:var(--mut)">${tr('Room','الغرفة')}</small><div style="font-weight:600">${rm(dp.room).no}</div></div></div><hr><div class="kv t"><span>${tr('Balance due at check-out','المتبقي عند الخروج')}</span><b>${money(dp.balance)}</b></div>`,btn('close',tr('Cancel','إلغاء'))+btn('coutok',ic('ok',16)+' '+tr('Confirm check-out','تأكيد تسجيل الخروج'),'navy',`data-id="${dp.id}"`),'s');break}
 case 'coutok':{const dp=DATA.dep.find(x=>x.id==d.id);dp.status='out';dp.balance=0;rm(dp.room).status='Cleaning';closeModal();render();toast(tr('Check-out completed successfully.','تم تسجيل الخروج بنجاح.'));break}
 case 'selinv':{const s=S.f.bill.sel,i=s.indexOf(d.id);i<0?s.push(d.id):s.splice(i,1);updSel();break}
 case 'selall':{const L=billRows().map(i=>i.id);S.f.bill.sel=el.checked?L:[];updSel();break}
 case 'clrsel':S.f.bill.sel=[];updSel();break;
 case 'vinv':S.inv=d.id;go('invoice');break;
 case 'refund':confirmDel(tr('Refund invoice?','استرداد الفاتورة؟'),tr(`The amount of invoice ${d.id} will be marked as refunded.`,`سيتم تحديد مبلغ الفاتورة ${d.id} كمسترد.`),'','refundok',d.id);break;
 case 'refundok':DATA.invoices.find(x=>x.id==d.id).status='Refunded';closeModal();render();toast(tr('Invoice refunded.','تم استرداد الفاتورة.'));break;
 case 'payopen':S.pay=null;payModal();break;
 case 'paym':S.pay.method=d.m;payModal();break;
 case 'payok':payOk();break;
 case 'paysel':S.pay={id:el.value,method:S.pay.method};payModal();break}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.tagName=='SELECT')return;if(b.tagName=='A')e.preventDefault();if(b.type=='checkbox'&&!['selinv','selall'].includes(b.dataset.a))return;act(b.dataset.a,b)});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.ch)act(t.dataset.ch,t);if(t.dataset.flt)flt(t);if(t.closest('#modal')&&t.dataset.chk!==undefined)resAuto()});
function flt(t){const[k,p]=t.dataset.flt.split('.'),o=k=='gen'?S.gen:S.f[k];o[p]=t.value;if(o.p!==undefined)o.p=1;refreshTbl()}
document.addEventListener('input',e=>{const t=e.target;if(t.id=='em0')S.email=t.value;if(t.id=='pw0')S.pw=t.value;if(t.dataset.flt)flt(t);if(t.classList.contains('cbi')){t.dataset.code='';cbList(t)}if(t.dataset.f=='price')t.dataset.manual='1';if(t.closest('#modal')&&t.dataset.chk!==undefined)resAuto()});
document.addEventListener('focusin',e=>{if(e.target.classList&&e.target.classList.contains('cbi'))cbList(e.target)});
document.addEventListener('mousedown',e=>{const it=e.target.closest('.cbl div[data-code]');if(it){const inp=it.parentElement.previousElementSibling;inp.dataset.code=it.dataset.code;inp.value=natName(it.dataset.code);it.parentElement.style.display='none';e.preventDefault()}else if(!e.target.closest('.cb'))document.querySelectorAll('.cbl').forEach(x=>x.style.display='none')});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&(e.target.id=='em0'||e.target.id=='pw0'))signIn();if(e.key=='Escape')closeModal()});
render();
</script></body></html>
